name: Windows checks and portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test analysis, privacy and GUI
        run: python -m unittest discover -s tests -v
      - name: Check publication hygiene
        run: python scripts/check_publish.py
      - name: Exercise actual Windows counters without external traffic
        run: |
          python run.py --monitor --seconds 5 --no-network --no-events --data-dir "$env:RUNNER_TEMP\lagcheck-smoke"
          $meta = Get-Content "$env:RUNNER_TEMP\lagcheck-smoke\latest.json" -Raw | ConvertFrom-Json
          $result = Get-Content (Join-Path $meta.session 'analysis.json') -Raw | ConvertFrom-Json
          if ($result.samples -lt 3) { throw 'Monitor did not produce enough samples' }
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build portable app
        run: python -m PyInstaller --noconfirm LagCheck.spec
      - name: Package with documentation, licenses and checksum
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: LagCheck-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
