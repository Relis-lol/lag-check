name: Fehler melden
description: Ein Problem in Lag Check beschreiben, ohne private Protokolle.
title: "[Fehler] "
body:
  - type: markdown
    attributes:
      value: "Bitte keine Rohlogs, IPs, Gerätenamen oder Zugangsdaten posten. Nutze höchstens den vorher geprüften datensparsamen Export."
  - type: input
    id: version
    attributes:
      label: Lag-Check-Version und Windows-Version
      placeholder: "z. B. 0.1.0, Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte und beobachtetes Verhalten
      description: Was hast du angeklickt, was ist passiert und was hast du erwartet?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine privaten Rohprotokolle oder Geheimnisse eingefügt.
          required: true
